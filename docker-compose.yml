services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk-postgres
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: helpdesk_pass
    ports:
      - "5432:5432"
    volumes:
      - helpdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk_user -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: helpdesk-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres:5432
      DB_NAME: helpdesk
      DB_USER: helpdesk_user
      DB_PASSWORD: helpdesk_pass
    ports:
      - "8080:8080"

volumes:
  helpdesk-postgres-data: